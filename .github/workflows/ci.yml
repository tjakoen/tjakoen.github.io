name: CI

# LOOP section 2, Tier 1, the push row: "the doctor + typecheck + tests + e2e + lint". Until now the
# only workflow here was pages.yml, which runs the typecheck and the unit tests on its way to a
# deploy. The e2e suite, forty-four specs, ran on nobody's machine but a laptop, and the lint count
# ran only at turn end. The 2026-08-13 audit filed that as F4: the standard described a CI that did
# not exist, which is worse than describing a weaker one, because a conformance pass asks "is CI on
# push wired" and the answer was yes.
#
# Separate from pages.yml on purpose. That file is the deploy path and is kept fast, so a flaky
# browser test can never be the reason the site fails to redeploy. This one is the gate; it fails
# visibly and blocks nothing else.
#
# WHAT IS DELIBERATELY NOT HERE:
#
# The doctor. `pantry doctor` is the mechanical tier and it belongs in this file, but @tjakoen/pantry
# is not on the public registry and this repo does not vendor it, so there is nothing for a runner to
# resolve. Adding a step that silently skips would be worse than the honest absence. The session-start
# hook at ~/.claude/tools/session-doctor.sh covers the doctor for now, which is a person's machine
# rather than a runner, and that limit is stated rather than papered over.
#
# A blocking lint gate. tools/lint-gate.ts runs here in report mode and exits 0 even when a count has
# risen. That is the owner's call of 2026-08-13: the only place the loop was given teeth is the
# human-lane path deny, and everything else stays advisory. The count is in the log, where a person
# reading a failed or passing run can see it, and no push is ever refused over a style flag.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # The e2e plan reads the e2e/local status that tools/e2e-local.sh posts.
  statuses: read

jobs:
  check:
    name: typecheck, tests, lint count
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun test
      # Advisory, and it says so above. `|| true` is not used: the gate already exits 0 by design,
      # and swallowing an exit code here would hide the day that design changes.
      - name: lint count against the committed baseline
        run: bun tools/lint-gate.ts

  # Decides once whether the browsers need to run at all, so the four shards below either all start
  # or all skip. Two reasons to skip, and nothing else:
  #
  #   1. Nothing the site serves changed. Only docs/, plans/, .claude/ and the Markdown at the root
  #      (README, CLAUDE.md, AGENTS.md) are exempt. Content, standards and every script stay in,
  #      because notes and standards render into the pages the WCAG and notes specs check.
  #   2. tools/e2e-local.sh already ran the whole suite on this exact code and passed. It posts an
  #      e2e/local status whose description is "tree <hash>" of the merged code it tested. The skip
  #      happens only when that hash equals the tree this run checked out, so a newer push, a main
  #      that moved, or a run that never finished all fall through to the full suite. On a push to
  #      main the status is read from the merged pull request's head, the merge commit's second
  #      parent, which only exists for a merge commit; a squash or a direct push always runs.
  e2e-plan:
    name: end to end, plan
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.plan.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            changed=$(git diff --name-only "$BASE...$HEAD_SHA")
            status_sha="$HEAD_SHA"
          else
            changed=$(git diff --name-only HEAD^ HEAD 2>/dev/null || echo "unknown")
            status_sha=$(git rev-parse --verify --quiet 'HEAD^2' || true)
          fi
          served=$(printf '%s\n' "$changed" | grep -vE '^(docs/|plans/|\.claude/|[^/]+\.md$)' | grep -v '^$' || true)
          if [ -z "$served" ]; then
            echo "Only docs, plans and root Markdown changed, so the browsers are skipped."
            echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          tree=$(git rev-parse 'HEAD^{tree}')
          if [ -n "$status_sha" ]; then
            local_pass=$(gh api "repos/${{ github.repository }}/commits/$status_sha/statuses" \
              --jq '[.[] | select(.context == "e2e/local")][0] | select(.state == "success") | .description' || true)
            if [ "$local_pass" = "tree $tree" ]; then
              echo "tools/e2e-local.sh passed on tree $tree, the code this run checked out, so the browsers are skipped."
              echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
            echo "No local pass for tree $tree (found: ${local_pass:-none}), so the full suite runs."
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"

  e2e:
    name: end to end (${{ matrix.shard }}/4)
    needs: e2e-plan
    if: needs.e2e-plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      # The browser download is cached on the lockfile, which pins the Playwright version. The system
      # libraries from --with-deps are not cacheable this way and still come from apt.
      - uses: actions/cache@v4
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      # The --with-deps half pulls fonts and libraries from the Ubuntu mirrors, and on 2026-11-11 the
      # runner lost DNS for those mirrors twice in a row, failing the job before a single test ran.
      # Three tries with a pause between them ride out a blip; a real outage still fails, on the third.
      - name: install chromium and its system libraries
        run: |
          cmd="bunx playwright install --with-deps chromium"
          [ "${{ steps.browsers.outputs.cache-hit }}" = "true" ] && cmd="bunx playwright install-deps chromium"
          for attempt in 1 2 3; do
            $cmd && exit 0
            echo "playwright install failed (attempt $attempt of 3), retrying in 30 seconds"
            sleep 30
          done
          exit 1
      # --ignore-snapshots because the committed baselines are darwin-only: every file in
      # e2e/visual.e2e.ts-snapshots ends -darwin.png, so a linux runner would look for names that do
      # not exist and fail nine assertions for the wrong reason. The rest of visual.e2e.ts still
      # runs. Cross-platform baselines are a real gap and belong to whoever wants visual regression
      # in CI, not to this file pretending it already has it.
      - run: bunx playwright test --ignore-snapshots --shard=${{ matrix.shard }}/4
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7
