name: Deploy to GitHub Pages

# The site is a static PROJECTION of the running server (ARCHITECTURE §18):
# bun install pulls the layer git-deps (docs ride inside the packages),
# bun run export crawls the booted app into dist/, bun run verify:export gates the result
# (every sitemap URL + every internal link must resolve to a real file — Phase 2), and Pages
# serves dist/. See ../SPLIT-PLAN.md § "The static front door".

on:
  push:
    branches: [main]
  workflow_dispatch:
  # The status bar's view counts are baked in at export time, so they are only as fresh as the last
  # deploy — this daily run refreshes them without anyone pushing. It rebuilds and redeploys the
  # whole site, which is cheap here (the export is a crawl of a booted server, no build step).
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      # The @tjakoen/* layers are published on the public npm registry — no registry secret,
      # no .npmrc. (Until 2026-07-30 they lived in GitHub Packages and this step wrote a token.)
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun test
      # Pull the view counts into .cache/analytics.json for the export below to bake into the status
      # bar. Unlike the beacon token in src/seo.ts, CF_ANALYTICS_TOKEN is a REAL secret (it can read
      # the account's analytics), so it lives in GitHub Secrets. Both unset — on a fork, or before
      # they are configured — and this step logs a skip and the site renders no numbers.
      - run: bun run analytics:pull
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_ANALYTICS_TOKEN: ${{ secrets.CF_ANALYTICS_TOKEN }}

      # The Cloudflare Web Analytics beacon needs nothing here: its token lives in src/seo.ts (it is
      # public either way) and export.ts spawns the server with NODE_ENV=production, which is the
      # switch that makes the beacon ship on the deployed pages but never on a local run.
      - run: bun run export
        env:
          PUBLIC_ORIGIN: https://tjakoen.github.io
      - run: bun run verify:export
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
