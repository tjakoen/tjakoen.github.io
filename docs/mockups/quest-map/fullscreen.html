* { box-sizing:border-box; }
body { margin:0; background:var(--q-paper); color:var(--q-ink); font:15px/1.5 ui-monospace,"SF Mono",Menlo,Consolas,monospace; }
header.top { display:flex; gap:1rem; align-items:center; justify-content:space-between; padding:.8rem 1.2rem; border-bottom:2px solid var(--q-line); position:sticky; top:0; background:var(--q-paper); z-index:20; }
h1 { font-size:1rem; margin:0; letter-spacing:.04em; }
button { font:inherit; color:var(--q-ink); background:var(--q-panel); border:2px solid var(--q-ink); padding:.25rem .7rem; cursor:pointer; box-shadow:3px 3px 0 var(--q-ink); }
button:active { transform:translate(2px,2px); box-shadow:1px 1px 0 var(--q-ink); }
main { max-width:1140px; margin:0 auto; padding:1.2rem; display:grid; grid-template-columns:minmax(0,1fr); gap:2.4rem; }
main > section { min-width:0; }
header.top { flex-wrap:wrap; }
h2 { font-size:.85rem; text-transform:uppercase; letter-spacing:.12em; color:var(--q-muted); margin:0 0 .5rem; }
.cap { color:var(--q-muted); font-size:.82rem; margin:.5rem 0 0; }
.frame { border:3px solid var(--q-ink); box-shadow:5px 5px 0 var(--q-ink); background:var(--q-panel); }
canvas { display:block; image-rendering:pixelated; }
.chip { background:var(--q-panel); border:2px solid var(--q-ink); padding:.05rem .5rem; font-size:.74rem; display:inline-block; }

/* 1. Google-Maps layout: panel left, map right, controls floating on the map */
.gm { display:grid; grid-template-columns:340px 1fr; overflow:hidden; }
.gm .place { border-right:3px solid var(--q-ink); overflow:auto; background:var(--q-panel); }
.gm { align-items:stretch; }
.gm .place { position:relative; overflow:hidden; }
.place .scroll { position:absolute; inset:0; overflow:auto; }
.gm .place .hero canvas { width:100%; height:auto; border-bottom:3px solid var(--q-ink); }
.gm .place { max-height:none; }
.place .body { padding:.7rem .9rem .9rem; gap:.55rem; }
.place h3 { font-size:1.15rem; }
.place .body { padding:.9rem 1rem 1.2rem; display:grid; gap:.75rem; }
.place h3 { margin:0; font-size:1.3rem; line-height:1.15; }
.place .sub { color:var(--q-muted); font-size:.8rem; }
.stars { color:var(--q-accent); letter-spacing:.1em; }
.actions { display:flex; gap:.5rem; flex-wrap:wrap; }
.actions button { padding:.2rem .6rem; font-size:.8rem; }
.actions .primary, .primary { background:var(--q-accent); color:var(--q-accent-ink); }
.tabs { display:flex; border-bottom:2px solid var(--q-line); }
.tabs span { padding:.3rem .8rem; font-size:.8rem; color:var(--q-muted); }
.tabs span[data-on] { color:var(--q-ink); border-bottom:4px solid var(--q-accent); margin-bottom:-2px; font-weight:700; }
.steps { list-style:none; margin:0; padding:0; display:grid; gap:0; }
.steps li { display:grid; grid-template-columns:30px 1fr; gap:.55rem; padding:.45rem 0; position:relative; }
.steps li::before { content:""; position:absolute; left:13px; top:2rem; bottom:-.5rem; border-left:3px dotted var(--q-main-edge); }
.steps li:last-child::before { display:none; }
.steps .n { width:26px; height:26px; background:var(--q-pin); color:#fff; display:grid; place-items:center; font-weight:700; border:2px solid var(--q-outline); clip-path:polygon(0 4px,4px 4px,4px 0,calc(100% - 4px) 0,calc(100% - 4px) 4px,100% 4px,100% calc(100% - 4px),calc(100% - 4px) calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,4px calc(100% - 4px),0 calc(100% - 4px)); }
.steps li[data-done] .n { background:#4e9a52; } .steps li[data-sel] strong { color:var(--q-roof); }
.steps small { display:block; color:var(--q-muted); font-size:.74rem; }
.src { font-size:.82rem; display:grid; gap:.25rem; }
.src div::before { content:"◇ "; color:var(--q-you); }

.mapside { position:relative; }
.mapside canvas { width:100%; height:auto; }
.search { position:absolute; left:12px; top:12px; width:min(330px,70%); background:var(--q-panel); border:3px solid var(--q-ink); box-shadow:3px 3px 0 var(--q-ink); display:flex; align-items:center; gap:.6rem; padding:.35rem .7rem; font-size:.85rem; color:var(--q-muted); }
.chips { position:absolute; left:12px; top:64px; display:flex; gap:.4rem; flex-wrap:wrap; max-width:75%; }
.chips .chip { box-shadow:2px 2px 0 var(--q-ink); color:var(--q-ink); }
.chips .chip[data-on] { background:var(--q-accent); color:var(--q-accent-ink); }

.ctl .stack button { border:0; box-shadow:none; width:36px; height:34px; padding:0; font-weight:700; font-size:1.1rem; }
.ctl .stack button + button { border-top:2px solid var(--q-line); }
.ctl .single { width:42px; height:40px; padding:0; }
.layers { position:absolute; left:12px; bottom:14px; display:flex; gap:.6rem; align-items:flex-end; }
.layers .tile { width:64px; height:64px; border:3px solid var(--q-ink); box-shadow:3px 3px 0 var(--q-ink); background:var(--q-panel); position:relative; }
.layers .tile canvas { width:100%; height:100%; }
.layers .tile span { position:absolute; left:0; right:0; bottom:0; font-size:.6rem; text-align:center; background:var(--q-panel); border-top:2px solid var(--q-ink); }

.lbl { position:absolute; transform:translate(-50%,0); font-weight:700; font-size:.7rem; letter-spacing:.12em; text-transform:uppercase; color:var(--q-label); white-space:nowrap; text-align:center; pointer-events:none;
  text-shadow:-2px 0 var(--q-halo),2px 0 var(--q-halo),0 -2px var(--q-halo),0 2px var(--q-halo),-1px -1px var(--q-halo),1px 1px var(--q-halo),-1px 1px var(--q-halo),1px -1px var(--q-halo); }
.lbl small { display:block; font-size:.6rem; letter-spacing:.04em; text-transform:none; font-weight:400; }
.lbl.box { background:var(--q-panel); border:2px dashed var(--q-muted); padding:0 .4rem; text-shadow:none; }

/* 2. zoomed, with the RPG quest modal */
.zoomframe { position:relative; overflow:hidden; }
.zoomframe canvas { width:100%; height:auto; }
.dim { position:absolute; inset:0; background:color-mix(in srgb,var(--q-outline) 45%,transparent); }
.modalwrap { position:absolute; right:3%; top:5%; width:min(470px,48%); filter:drop-shadow(5px 5px 0 var(--q-outline)); }

.ribbon { display:inline-block; background:var(--q-roof); color:#fff; padding:.05rem .6rem; font-size:.7rem; letter-spacing:.1em; text-transform:uppercase; justify-self:start; }
.modal h3 { margin:0; font-size:1.1rem; }
.stats { display:grid; grid-template-columns:repeat(3,1fr); gap:.45rem; }
.stat { border:2px solid var(--q-ink); padding:.3rem .5rem; background:var(--q-paper); }
.stat small { display:block; color:var(--q-muted); font-size:.62rem; text-transform:uppercase; letter-spacing:.08em; }
.stat strong { font-size:.98rem; }
.xp { height:14px; border:2px solid var(--q-ink); background:var(--q-paper); }
.xp i { display:block; height:100%; width:42%; background:repeating-linear-gradient(90deg,var(--q-accent) 0 6px,color-mix(in srgb,var(--q-accent) 65%,var(--q-panel)) 6px 8px); }
.modal ul { margin:0; padding:0; list-style:none; display:grid; gap:.2rem; font-size:.82rem; }
.modal li::before { content:"◆ "; color:var(--q-accent); }

.row { display:flex; gap:.6rem; flex-wrap:wrap; }

/* 3. guild card */
.cards { display:grid; grid-template-columns:1fr 1fr; gap:1.4rem; }
.card { padding:1rem 1.1rem; display:grid; gap:.7rem; background:linear-gradient(180deg,var(--q-panel),var(--q-ground)); }
.card .head { display:grid; grid-template-columns:96px 1fr; gap:.9rem; }
.card .head canvas { width:96px; height:96px; border:3px solid var(--q-ink); background:var(--q-ground2); }
.card h3 { margin:0; font-size:1.1rem; }
.badges { display:grid; grid-template-columns:repeat(6,1fr); gap:.4rem; }
.badges canvas { width:100%; aspect-ratio:1; height:auto; border:2px solid var(--q-ink); background:var(--q-paper); }
.badges .off { opacity:.35; filter:grayscale(1); }
.field { border:2px dashed var(--q-line); padding:.35rem .55rem; font-size:.8rem; background:var(--q-paper); }
code { background:var(--q-paper); border:1px solid var(--q-line); padding:0 .3rem; }

/* 4. lesson mode: the book is an in-world object, its pages read GRAIN tokens */
.lesson { display:grid; grid-template-columns:1.25fr 1fr; min-height:640px; }
.note { padding:1.2rem 1.6rem 1.2rem 3.2rem; border-right:3px solid var(--q-ink); font:15px/1.7 Georgia,serif; position:relative; }
.note .crumb { font:.75rem ui-monospace,monospace; color:var(--q-muted); letter-spacing:.06em; text-transform:uppercase; margin-left:-1.6rem; }
.note h3 { font-size:1.5rem; line-height:1.2; margin:.4rem 0 1rem; }
.note p { position:relative; }
.hl { background:linear-gradient(transparent 55%, color-mix(in srgb,var(--q-accent) 32%,transparent) 55%); outline:2px solid var(--q-accent); outline-offset:2px; }
.margin-rune { position:absolute; left:-2.1rem; top:.1rem; width:28px; height:28px; border:2px solid var(--q-ink); background:var(--q-panel); box-shadow:0 0 0 3px color-mix(in srgb,var(--q-accent) 45%,transparent); }
.toast { position:absolute; right:1rem; bottom:1rem; background:var(--q-accent); color:var(--q-accent-ink); border:3px solid var(--q-ink); box-shadow:3px 3px 0 var(--q-ink); padding:.25rem .7rem; font:700 .74rem ui-monospace,monospace; }
.side { padding:.9rem; background:var(--q-ground); display:grid; gap:.7rem; align-content:start; }
.hud { display:grid; gap:.25rem; }
.hud .top { display:flex; justify-content:space-between; font-size:.78rem; }
.side .tb { display:flex; gap:.3rem; flex-wrap:wrap; }
.side .tb span { border:2px solid var(--q-ink); padding:.05rem .55rem; font-size:.72rem; background:var(--q-panel); }
.side .tb span[data-on] { background:var(--q-accent); color:var(--q-accent-ink); }
.tome { display:grid; grid-template-columns:1fr 1fr; position:relative; border:3px solid var(--q-outline); background:#6b3f26; padding:8px; box-shadow:4px 4px 0 var(--q-ink); }
.tome::before { content:""; position:absolute; inset:0 auto 0 50%; width:6px; margin-left:-3px; background:repeating-linear-gradient(180deg,#3d2214 0 4px,#6b3f26 4px 8px); z-index:2; }
.tome::after { content:""; position:absolute; inset:3px; border:2px dashed #a8794e; pointer-events:none; }
.leaf { background:var(--q-paper); padding:.65rem .7rem; font:.76rem/1.5 Georgia,serif; min-height:360px; display:grid; gap:.5rem; align-content:start; }
.leaf h4 { margin:0; font:700 .62rem ui-monospace,monospace; letter-spacing:.1em; text-transform:uppercase; color:var(--q-roof); }
.dlg { display:grid; grid-template-columns:56px 1fr; gap:.5rem; border:3px solid var(--q-ink); background:var(--q-panel); padding:.4rem; position:relative; }
.dlg canvas { width:56px; height:56px; border:2px solid var(--q-ink); background:var(--q-ground2); }
.dlg .plate { font:700 .62rem ui-monospace,monospace; letter-spacing:.08em; text-transform:uppercase; color:var(--q-muted); }
.dlg .say { font:.8rem/1.45 Georgia,serif; color:var(--q-ink); }
.dlg .caret { animation:blink 1s steps(2) infinite; } @keyframes blink { 50% { opacity:0 } }
.dlg .adv { position:absolute; right:.35rem; bottom:.1rem; font-size:.7rem; color:var(--q-roof); }
.hist p { margin:0 0 .3rem; color:var(--q-muted); }
.hist p.fade { opacity:.6; }
.rune-card { display:grid; grid-template-columns:44px 1fr; gap:.5rem; border:2px solid var(--q-ink); padding:.35rem; background:color-mix(in srgb,var(--q-accent) 14%,var(--q-paper)); }
.rune-card canvas { width:44px; height:44px; border:2px solid var(--q-ink); background:var(--q-panel); }
.rune-card strong { font:700 .72rem ui-monospace,monospace; } .rune-card small { color:var(--q-muted); font-size:.7rem; display:block; }
.trial { border:2px dashed var(--q-muted); padding:.4rem .5rem; display:grid; gap:.25rem; }
.trial label { font:.72rem ui-monospace,monospace; display:flex; gap:.4rem; align-items:center; }
.leaf ul { margin:0; padding-left:1rem; }
.controls { display:grid; gap:.45rem; }
.ribbonbar { height:12px; border:2px solid var(--q-ink); background:var(--q-paper); position:relative; }
.ribbonbar i { position:absolute; inset:0 auto 0 0; width:38%; background:var(--q-roof); }
.ribbonbar u { position:absolute; left:38%; top:-5px; width:10px; height:20px; background:var(--q-roof); border:2px solid var(--q-ink); clip-path:polygon(0 0,100% 0,100% 100%,50% 70%,0 100%); }

/* ---------- pixel engine: every shape is whole pixels, no smoothing ---------- */
const WW=200, WH=160;
const NAMES=['water','water2','wave','foam','sand','sand2','grass','grass2','forest','forest2','rock','rock2','rockd','field','field2','meadow','meadow2','snow','snow2','road','road-edge','main','main-edge','fog','fog2','outline','pin','pin-hi','you','trunk','wall','wall2','castle','castle2','roof','roof2','flag','amber','glow','ground','ground2','paper','ink','stone'];

function hash2(x,y){ let h=(Math.imul(x|0,374761393)+Math.imul(y|0,668265263))>>>0; h=(h^(h>>>13))>>>0; h=Math.imul(h,1274126177)>>>0; return (h^(h>>>16))>>>0; }

function hash(str){ let h=2166136261; for(const c of str){ h^=c.charCodeAt(0); h=Math.imul(h,16777619);} return h>>>0; }

/* sprite builder: set pixels in local coords, add a 1px outline, blit anywhere */
const D4=[[1,0],[-1,0],[0,1],[0,-1]];
function spr(){ const m=new Map(); const o={ m,
  set(x,y,c){ m.set(x+','+y,c); return o; },
  rect(x,y,w,h,c){ for(let j=0;j<h;j++) for(let i=0;i<w;i++) m.set((x+i)+','+(y+j),c); return o; },
  outline(c){ const add=[]; for(const k of m.keys()){ const [x,y]=k.split(',').map(Number); for(const [dx,dy] of D4){ const kk=(x+dx)+','+(y+dy); if(!m.has(kk)) add.push(kk);} } add.forEach(k=>m.set(k,c)); return o; },
  blit(put,ox,oy){ for(const [k,c] of m){ const [x,y]=k.split(',').map(Number); put(ox+x,oy+y,c);} } }; return o; }

/* 3x5 pixel digits for pins */
const FONT={0:'111101101101111',1:'010110010010111',2:'111001111100111',3:'111001111001111',4:'101101111001001',5:'111100111001111',6:'111100111101111','?':'111001010000010'};

const REGIONS=[ {n:1,cx:34,cy:122}, {n:2,cx:62,cy:92}, {n:3,cx:104,cy:124}, {n:4,cx:146,cy:92}, {n:5,cx:92,cy:52}, {n:6,cx:150,cy:34}, {n:7,cx:160,cy:128} ];
const land=new Uint8Array(WW*WH), reg=new Uint8Array(WW*WH);
const MAIN=[[34,122],[48,110],[62,92],[82,108],[104,124],[126,108],[146,92],[120,70],[92,52],[122,40],[150,34]];
const MINOR=[[[62,92],[74,66],[92,52]],[[104,124],[132,134],[160,128]],[[146,92],[172,84],[176,64]]];
let cols=[], sprites=[], roadMain=new Set(), roadMinor=new Set();
(function buildMasks(){ for(let y=0;y<WH;y++) for(let x=0;x<WW;x++){ const i=y*WW+x;
  const e=1-(((x-100)/94)**2+((y-82)/72)**2)+(vn(x,y,20)-.5)*.55+(vn(x,y,7)-.5)*.16; const lake=(((x-46)/9)**2+((y-54)/5)**2)<1;
  land[i]=(e>.1&&!lake)?1:0; let best=1e9,id=1; for(const r of REGIONS){ const d=Math.hypot(x-r.cx,(y-r.cy)*1.25)/(r.n===7?1.15:1); if(d<best){best=d;id=r.n;} } reg[i]=id; } })();
function distTo(x,y,type,r=3){ let best=9; for(let dy=-r;dy<=r;dy++) for(let dx=-r;dx<=r;dx++){ const xx=x+dx,yy=y+dy; const t=(xx<0||yy<0||xx>=WW||yy>=WH)?0:land[yy*WW+xx]; if(t===type) best=Math.min(best,Math.max(Math.abs(dx),Math.abs(dy))); } return best; }
function line(pts,fn){ for(let k=0;k<pts.length-1;k++){ let [x0,y0]=pts[k],[x1,y1]=pts[k+1]; const n=Math.max(Math.abs(x1-x0),Math.abs(y1-y0)); for(let t=0;t<=n;t++){ const x=Math.round(x0+(x1-x0)*t/n), y=Math.round(y0+(y1-y0)*t/n+Math.sin(t/n*6.28*1)*2*(k%2?1:-1)); fn(x,y,t); } } }
function buildWorld(){
  cols=new Array(WW*WH); roadMain=new Set(); roadMinor=new Set(); sprites=[];
  for(let y=0;y<WH;y++) for(let x=0;x<WW;x++){ const i=y*WW+x; let c;
    if(!land[i]){ const d=distTo(x,y,1); c=d<=1?P.foam:d<=3?P.water2:P.water; if(d>3&&hash2(x,y)%31===0) c=P.wave; }
    else { const d=distTo(x,y,0,2); const r=reg[i];
      if(d<=2) c=(x+y)%2?P.sand:P.sand2;
      else if(r===1){ c=vn(x,y,4)>.52?P.grass:P.grass2; if(hash2(x,y)%67===0) c='#ffffff'; if(hash2(x,y)%97===0) c=P.amber; }
      else if(r===2){ c=vn(x,y,3)>.5?P.forest:P.forest2; }
      else if(r===3){ c=vn(x,y,3)>.5?P.rock:P.rock2; if(hash2(x,y)%61===0) c=P.rockd; }
      else if(r===4){ c=(vn(x,y,18)>.44)?(((y>>1)%2)?P.field:P.field2):(vn(x,y,4)>.5?P.grass:P.grass2); }
      else if(r===5){ c=vn(x,y,4)>.5?P.meadow:P.meadow2; if(hash2(x,y)%41===0) c=P.snow; }
      else if(r===6){ c=vn(x,y,4)>.5?P.snow:P.snow2; }
      else { c=vn(x,y,4)>.5?P.grass2:P.rock2; } }

}


function scene(cv,kind){ const W=cv.width,H=cv.height, ctx=cv.getContext('2d'); ctx.imageSmoothingEnabled=false;
  const put=(x,y,c)=>{ if(x<0||y<0||x>=W||y>=H) return; ctx.fillStyle=c; ctx.fillRect(x,y,1,1); };
  const gy=Math.round(H*.72); for(let y=0;y<H;y++) for(let x=0;x<W;x++){ put(x,y,y<H*.38?P.water2:y<H*.62?P.wave:P.foam); }
  for(let dy=-3;dy<=3;dy++) for(let dx=-3;dx<=3;dx++) if(dx*dx+dy*dy<=9) put(W-10+dx,7+dy,P.amber);
  [[8,6],[22,10],[34,5]].forEach(([x,y],i)=>{ for(let k=0;k<5+i;k++){ put(x+k,y,'#fff'); if(k>0&&k<4+i) put(x+k,y-1,'#fff'); } });
  const ground={mines:[P.rock,P.rock2],forest:[P.forest,P.forest2],keep:[P.meadow,P.meadow2],hall:[P.field,P.field2],summit:[P.snow,P.snow2],hills:[P.grass,P.grass2]}[kind];
  for(let y=gy;y<H;y++) for(let x=0;x<W;x++){ put(x,y,((x>>1)+y)%2?ground[0]:ground[1]); }
  for(let x=0;x<W;x++) put(x,gy,P.outline);

/* ===== view: integer zoom levels, 2 css px per canvas px, centre in world coords ===== */
const S=2, LV=[2,3,4,6], LNAME=['World','Regions','Landmark','Stops'];
let V={cx:104,cy:84,z:2}, sel={t:'none'}, collapsed=false, filter='All', q='';
const cv=document.getElementById('map'), ctx=cv.getContext('2d'), over=document.getElementById('over'), fx=document.getElementById('fx'), fctx=fx.getContext('2d');
let CW=0,CH=0;
const wide=()=>innerWidth>=800;
function pads(){ if(collapsed) return {l:0,b:0}; return wide()?{l:384,b:0}:{l:0,b:Math.round(innerHeight*.44)}; }
function origin(){ const p=pads(), z=V.z; let vx=V.cx-(CW/2+p.l/2/S)/z, vy=V.cy-(CH/2-p.b/2/S)/z; vx=Math.round(vx*z)/z; vy=Math.round(vy*z)/z; return {vx,vy,z}; }
function resize(){ CW=Math.ceil(innerWidth/S); CH=Math.ceil(innerHeight/S); cv.width=CW; cv.height=CH; cv.style.width=CW*S+'px'; cv.style.height=CH*S+'px'; fx.width=CW; fx.height=CH; fx.style.width=CW*S+'px'; fx.style.height=CH*S+'px'; draw(); }

function filterOk(q){ if(filter==='All') return true; if(filter==='Loop') return q.region===2; if(filter==='Models') return q.region===3; if(filter==='Leading') return q.region===4; if(filter==='Design') return q.region===5; if(filter==='Not started') return !q.done; return true; }

/* The terrain and every static sprite are drawn once into an offscreen canvas, one pixel per map pixel, with a margin of open
   water. Each frame is then a single scaled drawImage plus the few things that depend on the view (camp, pins, you). */
const M=120; let base=null, glints=[];
function bake(){ base=document.createElement('canvas'); base.width=WW+2*M; base.height=WH+2*M; const b=base.getContext('2d'); glints=[];
  const isWater=c=>c===P.water||c===P.water2||c===P.wave||c===P.foam;
  for(let y=-M;y<WH+M;y++) for(let x=-M;x<WW+M;x++){ const inW=!(x<0||y<0||x>=WW||y>=WH); const c=inW?cols[y*WW+x]:(hash2(x,y)%31===0?P.wave:P.water); b.fillStyle=c; b.fillRect(x+M,y+M,1,1); if(isWater(c)&&hash2(x,y)%53===0) glints.push([x,y,hash2(x,y)>>9]); }
  const put=(wx,wy,c)=>{ b.fillStyle=c; b.fillRect(wx+M,wy+M,1,1); };
  sprites.cave.blit(put,104,127); sprites.forEach(s=>s.f(put)); }
let lastDraw=0, dq=0;
const drawSoon=()=>{ if(dq) return; dq=requestAnimationFrame(()=>{ dq=0; draw(); }); };
function draw(){
  const {vx,vy,z}=origin(); ctx.imageSmoothingEnabled=false; lastDraw=performance.now(); fctx.clearRect(0,0,fx.width,fx.height);
  ctx.fillStyle=P.water; ctx.fillRect(0,0,CW,CH);
  { const ix=Math.floor(vx), iy=Math.floor(vy), sw=Math.ceil(CW/z)+2, sh=Math.ceil(CH/z)+2; ctx.drawImage(base,ix+M,iy+M,sw,sh,-Math.round((vx-ix)*z),-Math.round((vy-iy)*z),sw*z,sh*z); }
  const put=(wx,wy,c)=>{ const sx=Math.round((wx-vx)*z), sy=Math.round((wy-vy)*z); if(sx<-z||sy<-z||sx>=CW||sy>=CH) return; ctx.fillStyle=c; ctx.fillRect(sx,sy,z,z); };
  if(z>=4){ tentSpr().blit(put,92,134); tentSpr().blit(put,96,136); torchSpr().blit(put,100,128); torchSpr().blit(put,108,128); cartSpr().blit(put,112,134); for(let x=100;x<122;x+=2) put(x,135,P.trunk); for(let x=100;x<124;x++) put(x,136,P.rockd); torchSpr().blit(put,72,138); }
  // pins
  const zp=z>=4?3:2; const items=[];
  const pinAt=(wx,wy,n,state,selected)=>{ const bx=Math.round((wx-vx)*z), by=Math.round((wy-vy)*z); if(bx<-30||by<-30||bx>CW+30||by>CH+30) return;
    const pp=dy=>(lx,ly,c)=>{ const sx=bx+lx*zp, sy=by+ly*zp-dy; if(sx<-zp||sy<-zp||sx>=CW||sy>=CH) return; ctx.fillStyle=c; ctx.fillRect(sx,sy,zp,zp); };
    if(selected) for(let i=-4;i<=4;i++) pp(0)(i,0,'rgba(0,0,0,.28)');
    pinSpr(n,state).blit(pp(selected?3*zp:0),0,0); };
  const add=(key,wx,wy,kind,o)=>items.push({key,wx,wy,kind,...o});
  if(z===2){
    REG.forEach(r=>{ const st=byReg(r.n).length&&byReg(r.n).every(x=>x.done)?'done':(r.n===1?'done':'open'); const selR=sel.t==='region'&&sel.id===r.n; pinAt(r.pin[0],r.pin[1],r.n,st,selR); add('hr'+r.n,r.pin[0],r.pin[1],'hit',{label:r.name+', region '+r.n,act:()=>selectRegion(r.n)}); add('lr'+r.n,r.lbl[0],r.lbl[1],'lbl',{text:r.name,cls:'region'}); });
    pinAt(166,112,0,'locked',false); add('lfog',166,119,'lbl',{text:'Unmapped',sub:'2 more notes to chart',cls:'region box'});
  } else {
    if(z===3) REG.forEach(r=>add('lr'+r.n,r.lbl[0],r.lbl[1]+6,'lbl',{text:r.name,cls:'region faint'}));
    QUESTS.forEach((qq,i)=>{ const n=byReg(qq.region).indexOf(qq)+1, ok=filterOk(qq), selQ=sel.t==='quest'&&sel.id===qq.id||(sel.t==='stop'&&sel.id===qq.id); pinAt(qq.pos[0],qq.pos[1],n,!ok?'locked':qq.done?'done':'open',selQ);
      add('hq'+qq.id,qq.pos[0],qq.pos[1],'hit',{label:qq.title+', quest '+n,act:()=>selectQuest(qq.id)}); add('lq'+qq.id,qq.pos[0],qq.pos[1]+2.5,'lbl',{text:qq.short,cls:'quest',done:qq.done}); });
    if(z>=4&&(sel.t==='quest'||sel.t==='stop')){ const qq=QUESTS.find(x=>x.id===sel.id); qq.stops.slice(0,9).forEach((s,i)=>{ const p=stopPos(qq,i); pinAt(p[0],p[1],Math.min(i+1,6),'stop',sel.t==='stop'&&sel.i===i);
      add('hs'+i,p[0],p[1],'hit',{label:'Stop '+(i+1)+': '+s,act:()=>selectStop(qq.id,i)}); if(z>=6) add('ls'+i,p[0],p[1]+2.5,'lbl',{text:'Stop '+(i+1),sub:s.length>34?s.slice(0,32)+'...':s,cls:'quest'}); }); }
  }
  // you are here dot
  { const bx=Math.round((YOU[0]-vx)*z), by=Math.round((YOU[1]-vy)*z); const pp=(lx,ly,c)=>{ const sx=bx+lx*zp, sy=by+ly*zp; if(sx<0||sy<0||sx>=CW||sy>=CH) return; ctx.fillStyle=c; ctx.fillRect(sx,sy,zp,zp); }; youSpr().blit(pp,0,0); }
  syncOverlay(items,vx,vy,z,zp);
  document.getElementById('zname').textContent=LNAME[LV.indexOf(z)];
  document.querySelectorAll('.zlevels i').forEach((e,i)=>e.toggleAttribute('data-on',i<=LV.indexOf(z)));
}
const els=new Map();
function syncOverlay(items,vx,vy,z,zp){ const keep=new Set();
  items.forEach(it=>{ keep.add(it.key); let e=els.get(it.key); if(!e){ if(it.kind==='hit'){ e=document.createElement('button'); e.className='hit'; e.setAttribute('aria-label',it.label); e.addEventListener('pointerdown',ev=>ev.stopPropagation()); e.addEventListener('click',ev=>{ ev.stopPropagation(); e._act(); }); }
      else { e=document.createElement('div'); e.className='lbl '+(it.cls||''); e.innerHTML=it.text+(it.sub?'<small>'+it.sub+'</small>':''); if(it.done) e.dataset.done=1; }
      over.appendChild(e); els.set(it.key,e); }
    e._act=it.act; const sx=Math.round((it.wx-vx)*z)*S, sy=Math.round((it.wy-vy)*z)*S;
    if(it.kind==='hit'){ e.style.left=(sx-17)+'px'; e.style.top=(sy-10*zp*S)+'px'; e.style.height=(10*zp*S)+'px'; } else { e.style.left=sx+'px'; e.style.top=sy+'px'; } });
  for(const [k,e] of els) if(!keep.has(k)){ e.remove(); els.delete(k); } }

/* ===== motion: pan by drag, integer zoom steps, fly-to ===== */
let anim=0;
function setZ(newZ,ax,ay){ // keep the world point under (ax,ay) css px fixed
  const o=origin(); const wx=o.vx+(ax/S)/o.z, wy=o.vy+(ay/S)/o.z; V.z=newZ; const p=pads();
  V.cx=wx-((ax/S)-(CW/2+p.l/2/S))/V.z; V.cy=wy-((ay/S)-(CH/2-p.b/2/S))/V.z; clampV(); }
function clampV(){ V.cx=Math.max(-10,Math.min(WW+10,V.cx)); V.cy=Math.max(-10,Math.min(WH+10,V.cy)); }
function stepZoom(dir,ax,ay){ const i=LV.indexOf(V.z), j=Math.max(0,Math.min(LV.length-1,i+dir)); if(j===i) return; setZ(LV[j],ax??innerWidth/2,ay??innerHeight/2); draw(); }
function flyTo(cx,cy,z){ cancelAnimationFrame(anim); const f={...V}, t0=performance.now(), dur=700; const i0=LV.indexOf(f.z), i1=LV.indexOf(z), n=Math.abs(i1-i0);
  (function step(now){ const t=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-t,3); V.cx=f.cx+(cx-f.cx)*e; V.cy=f.cy+(cy-f.cy)*e; const k=Math.min(n,Math.floor(t*(n+1))); V.z=LV[i0+Math.sign(i1-i0)*k]; draw(); if(t<1) anim=requestAnimationFrame(step); })(t0); }
const stage=document.getElementById('stage'); let drag=null;
stage.addEventListener('pointerdown',e=>{ if(e.target.closest('.col,.ctl,.topright,.chipsbar,.zbar')) return; cancelAnimationFrame(anim); drag={x:e.clientX,y:e.clientY,moved:false}; stage.setPointerCapture(e.pointerId); stage.classList.add('drag'); });
stage.addEventListener('pointermove',e=>{ if(!drag) return; const dx=e.clientX-drag.x, dy=e.clientY-drag.y; if(Math.abs(dx)+Math.abs(dy)>2) drag.moved=true; drag.x=e.clientX; drag.y=e.clientY; V.cx-=dx/(V.z*S); V.cy-=dy/(V.z*S); clampV(); drawSoon(); });
stage.addEventListener('pointerup',e=>{ drag=null; stage.classList.remove('drag'); });
let wheelT=0; stage.addEventListener('wheel',e=>{ e.preventDefault(); const now=performance.now(); if(now-wheelT<160) return; wheelT=now; stepZoom(e.deltaY<0?1:-1,e.clientX,e.clientY); },{passive:false});
stage.addEventListener('dblclick',e=>{ if(e.target.closest('.hit')) return; stepZoom(1,e.clientX,e.clientY); });
addEventListener('keydown',e=>{ if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT') return; const st=60/(V.z*S)*S; if(e.key==='ArrowLeft') V.cx-=st/ S/ 1; else if(e.key==='ArrowRight') V.cx+=st/S; else if(e.key==='ArrowUp') V.cy-=st/S; else if(e.key==='ArrowDown') V.cy+=st/S; else if(e.key==='+'||e.key==='=') stepZoom(1); else if(e.key==='-') stepZoom(-1); else if(e.key==='Escape') home(); else return; e.preventDefault(); clampV(); draw(); });

/* ===== selection and the place panel ===== */
const panel=document.getElementById('panel');
function home(){ sel={t:'none'}; renderPanel(); flyTo(104,84,2); }
function selectRegion(n){ sel={t:'region',id:n}; const r=REG[n-1]; renderPanel(); flyTo(r.c[0],r.c[1],3); }
function selectQuest(id){ sel={t:'quest',id}; const qq=QUESTS.find(x=>x.id===id); renderPanel(); flyTo(qq.pos[0],qq.pos[1]+6,4); }
function selectStop(id,i){ sel={t:'stop',id,i}; const qq=QUESTS.find(x=>x.id===id), p=stopPos(qq,i); renderPanel(); flyTo(p[0],p[1],6); }
const hours=Math.round(QUESTS.reduce((a,x)=>a+x.min,0)/6)/10;
function sceneHead(kind,h=44){ return `<div class="pc-head"><canvas class="scene" data-kind="${kind}" width="110" height="${h}"></canvas></div>`; }
function renderPanel(){
  const dn=QUESTS.filter(x=>x.done).length;
  let h='';
  if(q.trim()){ const m=QUESTS.filter(x=>(x.title+' '+x.short).toLowerCase().includes(q.trim().toLowerCase()));
    h=`<div class="pc-body"><h3>Search</h3><div class="sub">${m.length} quest${m.length===1?'':'s'} match</div><div class="results">${m.map(x=>`<button class="rowbtn" data-q="${x.id}"><span class="n">${byReg(x.region).indexOf(x)+1}</span><span>${x.title}<small>${REG[x.region-1].name} · ${x.min} min</small></span><span class="go">&#9654;</span></button>`).join('')||'<div class="sub">Nothing yet. A note joins the map when it publishes and has a lesson.</div>'}</div></div>`; }
  else if(sel.t==='none'){
    h=sceneHead('hills')+`<div class="pc-body"><h3>Learn AI with me</h3><div class="sub">${QUESTS.length} quests · 6 regions · about ${hours} hours of reading</div>
      <p style="margin:0;font:.86rem/1.55 Georgia,serif">A guided path through what I have actually built and learned, in my own notes and the sources I used. Pick a region, or zoom in and wander.</p>
      <div class="row"><button class="primary" data-act="start">&#9654; Start at the Foothills</button><button data-act="cont">Continue</button></div>
      <div><strong>Regions</strong></div>${REG.slice(1).map(r=>{ const qs=byReg(r.n), d=qs.filter(x=>x.done).length; return `<button class="rowbtn" data-r="${r.n}"><span class="n">${r.n}</span><span>${r.name}<small>${r.sub} · ${d}/${qs.length} done</small></span><span class="go">&#9654;</span></button>`; }).join('')}
      <div class="sub">${dn} of ${QUESTS.length} quests done. Drag to pan, scroll or +/- to zoom, Esc to return here.</div></div>`; }
  else if(sel.t==='region'){ const r=REG[sel.id-1], qs=byReg(r.n);
    h=sceneHead(r.scene)+`<div class="pc-body"><div class="sub"><a href="#" data-act="home" style="color:inherit">&#8592; All regions</a></div><h3>${r.name}</h3><div class="sub">${r.sub}</div><p style="margin:0;font:.86rem/1.55 Georgia,serif">${r.blurb}</p>
      <div><strong>Route</strong> <span class="sub">${qs.length} quests · about ${qs.reduce((a,x)=>a+x.min,0)} min of reading</span></div>${qs.map((x,i)=>`<button class="rowbtn" data-q="${x.id}" ${x.done?'data-done':''}><span class="n">${i+1}</span><span>${x.title}<small>Lv ${x.lv} ${x.level} · ${x.min} min · ${x.stops.length} stops</small></span><span class="go">&#9654;</span></button>`).join('')||'<div class="sub">Outside this site: Claude Academy, for the basics.</div>'}</div>`; }
  else { const qq=QUESTS.find(x=>x.id===sel.id), r=REG[qq.region-1], i=byReg(r.n).indexOf(qq)+1;
    h=sceneHead(r.scene,40)+`<div class="pc-body"><div class="sub"><a href="#" data-r="${r.n}" style="color:inherit">&#8592; ${r.name}</a></div><span class="ribbon">${r.name} · Quest ${i} of ${byReg(r.n).length}</span><h3>${qq.title}</h3>
      <div class="row"><span class="chip">Class: ${qq.cls}</span><span class="chip">Level: ${qq.level}</span></div>
      <div class="stats"><div class="stat"><small>Quest level</small><strong>Lv ${qq.lv}</strong></div><div class="stat"><small>Experience</small><strong>+${qq.xp.toLocaleString()} XP</strong></div><div class="stat"><small>Reading</small><strong>~${qq.min} min</strong></div></div>
      <div><strong>It covers</strong><ul style="margin:.2rem 0 0;padding-left:1rem">${qq.learn.map(l=>`<li>${l}</li>`).join('')}</ul></div>
      <div><strong>${qq.stops.length} stops</strong>${qq.stops.map((s,j)=>`<div class="stopline" data-s="${j}" ${sel.t==='stop'&&sel.i===j?'data-sel':''}><span class="sn">${j+1}</span><span><strong>${s}</strong></span></div>`).join('')}</div>
      <div class="row"><button class="primary" data-act="begin">Begin quest</button><button data-act="note">Read the note only</button></div></div>`; }
  panel.innerHTML=h; panel.querySelectorAll('canvas.scene').forEach(c=>scene(c,c.dataset.kind));
}
panel.addEventListener('click',e=>{ const b=e.target.closest('[data-q],[data-r],[data-act],[data-s]'); if(!b) return; e.preventDefault();
  if(b.dataset.q){ q=''; document.getElementById('q').value=''; selectQuest(b.dataset.q); }
  else if(b.dataset.r) selectRegion(+b.dataset.r);
  else if(b.dataset.s!==undefined) selectStop(sel.id,+b.dataset.s);
  else if(b.dataset.act==='home') home();
  else if(b.dataset.act==='start'){ selectRegion(1); }
  else if(b.dataset.act==='cont'){ const nx=QUESTS.find(x=>!x.done); selectQuest(nx.id); }
  else if(b.dataset.act==='begin'||b.dataset.act==='note'){ const t=document.getElementById('toast'); t.textContent=b.dataset.act==='begin'?'Opens the note with the quest book (lesson mode)':'Opens the note on its own'; t.hidden=false; setTimeout(()=>t.hidden=true,2200); } });
document.getElementById('q').addEventListener('input',e=>{ q=e.target.value; renderPanel(); });
document.getElementById('fold').addEventListener('click',()=>{ collapsed=!collapsed; panel.hidden=collapsed; document.getElementById('fold').textContent=collapsed?'▶':'◀'; draw(); });
document.querySelectorAll('.chipsbar .chip').forEach(c=>c.addEventListener('click',()=>{ filter=c.textContent; document.querySelectorAll('.chipsbar .chip').forEach(x=>x.toggleAttribute('data-on',x===c)); draw(); }));
document.getElementById('zin').onclick=()=>stepZoom(1); document.getElementById('zout').onclick=()=>stepZoom(-1);
document.getElementById('me').onclick=()=>flyTo(YOU[0],YOU[1]+4,4);
const root=document.documentElement;
document.getElementById('flavor').onchange=e=>{ root.dataset.theme=e.target.value; reskin(); };
document.querySelectorAll('#scheme button').forEach(b=>b.onclick=()=>{ const v=b.dataset.s; if(v==='auto') root.removeAttribute('data-color-scheme'); else root.dataset.colorScheme=v; document.querySelectorAll('#scheme button').forEach(x=>x.setAttribute('aria-pressed',x===b)); reskin(); });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>reskin());
function reskin(){ loadPalette(); buildWorld(); bake(); layer(); renderPanel(); draw(); }
function layer(){ const c=document.getElementById('c-layer'),x=c.getContext('2d'); x.imageSmoothingEnabled=false; for(let y=0;y<32;y++) for(let i=0;i<32;i++){ x.fillStyle=cols[(y*4+16)*WW+(i*4+16)]||P.water; x.fillRect(i,y,1,1);} }

/* ---- Motion. A second canvas over the map, redrawn about seven times a second so it moves in pixel steps.
   Water glints, torch flames, the summit flag and a pulse on the adventurer. It is decoration only: the pins, labels and route lists are unchanged.
   It starts off when the system asks for reduced motion, and the Motion button turns it on or off either way. */
const reduce=matchMedia('(prefers-reduced-motion: reduce)');
let motion=!reduce.matches, raf=0, lastT=0;
const mbtn=document.getElementById('motion');
function fxFrame(t){
  if(t-lastDraw<260) return; // the view is moving: draw nothing extra, so pan, zoom and fly stay smooth
  const {vx,vy,z}=origin(); fctx.clearRect(0,0,fx.width,fx.height);
  const f=Math.floor(t/160);
  const px=(wx,wy,c,a=1)=>{ const sx=Math.round((wx-vx)*z), sy=Math.round((wy-vy)*z); if(sx<-z||sy<-z||sx>=CW||sy>=CH) return; fctx.globalAlpha=a; fctx.fillStyle=c; fctx.fillRect(sx,sy,z,z); };
  for(let i=0;i<glints.length;i++){ const g=glints[i], ph=(f+g[2])%8; if(ph<2) px(g[0],g[1],P.foam,ph?.9:.5); }
  if(z>=4){ [[100,128],[108,128],[72,138]].forEach(([x,y])=>{ px(x,y-4,f%2?P.glow:P.amber); px(x,y-5,(f%3)?P.amber:P.pinHi); }); }
  for(let i=0;i<5;i++){ const w=((f+i)%4<2)?0:1, o=w+(i>2?1:0); px(151+i,10+o,P.flag); if(i<4) px(151+i,11+o,P.pinHi,.8); }
  { const r=f%7; for(let a=0;a<12;a++){ const th=a/12*Math.PI*2; px(YOU[0]+Math.round(Math.cos(th)*(r+2)),YOU[1]+Math.round(Math.sin(th)*(r+2)),P.you,1-r/7); } }
  fctx.globalAlpha=1;
}
function fxLoop(now){ raf=0; if(!motion||document.hidden) return; if(now-lastT>=160){ lastT=now; fxFrame(now); } raf=requestAnimationFrame(fxLoop); }
function setMotion(on){ motion=on; mbtn.setAttribute('aria-pressed',String(on)); if(on){ if(!raf) raf=requestAnimationFrame(fxLoop); } else { cancelAnimationFrame(raf); raf=0; fctx.clearRect(0,0,fx.width,fx.height); } }
mbtn.onclick=()=>setMotion(!motion);
reduce.addEventListener('change',e=>setMotion(!e.matches));
document.addEventListener('visibilitychange',()=>{ if(motion&&!raf) raf=requestAnimationFrame(fxLoop); });
addEventListener('resize',resize);
loadPalette(); buildWorld(); bake(); layer(); renderPanel(); resize(); setMotion(motion);

</script>
</body>
</html>
