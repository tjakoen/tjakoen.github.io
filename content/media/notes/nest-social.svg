<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200" role="img" aria-label="A cream square card for the ant colony note, with a Braille anthill, dotted scent trails, and the title My portfolio has ants now.">
