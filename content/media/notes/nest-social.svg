    <text x="600" y="540">⠀⣴⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣦⠀</text>
    <text x="600" y="560">⢸⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⡇</text>
    <text x="600" y="580">⠈⠛⠛⠛⠛⠛⠛⠛⠛⠛⠛⠛⠛⠁</text>
  </g>
  <circle cx="600" cy="546" r="22" fill="#faf7f1"/>
  <path d="M600 570 C520 640 430 690 330 760" fill="none" stroke="#d97757" stroke-width="4" stroke-dasharray="2 14" stroke-linecap="round"/>
  <path d="M600 570 C690 650 780 700 890 760" fill="none" stroke="#d97757" stroke-width="4" stroke-dasharray="2 14" stroke-linecap="round"/>

  <g fill="#2b2b2b" stroke="#2b2b2b" stroke-width="3" stroke-linecap="round">
    <g transform="translate(320 760)">
