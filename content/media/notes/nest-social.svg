  <text x="86" y="1010" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#2b2b2b">No canvas. No game library.</text>
  <text x="86" y="1055" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#2b2b2b">One plain JavaScript file.</text>
  <text x="86" y="1108" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" fill="#d97757" letter-spacing="2">PORTFOLIO.TJAKOEN.COM</text>
