  <text x="86" y="238" font-family="Georgia, 'Times New Roman', serif" font-size="72" fill="#2b2b2b">has ants now.</text>
  <text x="90" y="306" font-family="Georgia, 'Times New Roman', serif" font-size="28" fill="#6b6259">A small ecosystem hidden under the copy.</text>

