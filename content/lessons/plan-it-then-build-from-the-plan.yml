id: plan-it-then-build-from-the-plan
note: plan-it-then-build-from-the-plan
title: Plan it, then build from the plan
summary: In four short stops I show you what a plan is, why to talk about the stack first, how to have the AI draft the plan and edit it yourself, and the one habit that makes it work, which is building one step at a time.
audio: /media/lessons/plan-it-then-build-from-the-plan.m4a
stops:
- title: A list you can tick off
  note: plan-it-then-build-from-the-plan
  from: intro
  to: a-plan-is-a-list-you-can-tick-off
  runes:
  - id: small-steps
    section: a-plan-is-a-list-you-can-tick-off
    quote: A list of small steps, in order
  trial: Think of something you are building and write its goal and two steps, each with a done line.
  digest:
  - A plan is a short file with a goal, small steps in order, and what done looks like for each.
  - It gives you something to point at when a session gets long.
- title: Talk about the stack first
  note: plan-it-then-build-from-the-plan
  from: talk-about-the-stack-first
  to: talk-about-the-stack-first
  runes:
  - id: stack-familiar
    section: talk-about-the-stack-first
    quote: stick with what you're familiar with
  - id: no-blind-stack
    section: talk-about-the-stack-first
    quote: you risk not knowing what you're building
  trial: Describe something you want to build to your AI and ask what stack it would pick and why. Choose one you already know, and write it at the top of your plan.
  digest:
  - Talk through the stack with your AI before the plan has steps.
  - Stick with what you know and with popular tools.
  - Never do agentic coding in a stack you have no experience with.
- title: Draft it, edit it, one step at a time
  note: plan-it-then-build-from-the-plan
  from: let-the-ai-draft-it-then-you-edit-it
  to: one-step-at-a-time
  runes:
  - id: one-step-at-a-time
    section: one-step-at-a-time
    quote: Do step 1 only. Stop and show me when it's done.
  trial: Ask your AI for a plan with no code yet. Split one step, cut one, then tell it to do step 1 only and stop.
  digest:
  - Have the AI draft the plan, then edit it yourself. A step too big to explain in a sentence needs splitting.
  - Build one step at a time and check each against its done line.
- title: Keep it where it survives
  note: plan-it-then-build-from-the-plan
  from: keep-it-where-it-survives
  to: try-this
  runes:
  - id: lives-in-a-file
    section: keep-it-where-it-survives
    quote: If the plan lives only in a chat, it dies when the session does.
  trial: Ask your AI for a plan with no code yet, edit it, save it in your project, then have it do step 1 only and check the result against the done line.
  digest:
  - Keep the plan in a file next to the brief so any session can pick it up.
  - A plan is a guess. Update it when it changes, and keep you and the AI on the same one.
