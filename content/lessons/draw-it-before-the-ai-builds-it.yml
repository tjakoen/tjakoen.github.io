id: draw-it-before-the-ai-builds-it
note: draw-it-before-the-ai-builds-it
title: Draw it before the AI builds it
summary: In three short stops I tell you why drawing matters more now that you do not type the code, give you the one question each of six old drawings answers, and show you how to draw badly on purpose and make your AI ask you questions about it.
audio: /media/lessons/draw-it-before-the-ai-builds-it.m4a
stops:
  - title: The sentence that costs the most
    note: draw-it-before-the-ai-builds-it
    from: intro
    to: why-drawing-matters-more-now
    runes:
      - id: the-walk-you-skipped
        section: why-drawing-matters-more-now
        quote: A drawing is the walk you skipped.
    trial: Think of the last time you said that is not what I meant. Write down what you had not decided yet.
    digest:
      - The AI builds what you described, and what you described had holes.
      - When you do not type the code, you miss the walk through it.
      - A drawing is that walk, and a map you can hand to the AI.
  - title: Six drawings, one question each
    note: draw-it-before-the-ai-builds-it
    from: six-drawings-one-question-each
    to: six-drawings-one-question-each
    runes:
      - id: one-question-each
        section: six-drawings-one-question-each
        quote: Reach for the one that answers the question
    trial: Pick a small thing you want to build and name which one of the six answers the question you cannot answer yet.
    digest:
      - Use case, who does what. Data flow, where information goes. ERD, what it remembers.
      - Wireframe, what is on each screen. Mockup, how it looks. Design system, the reusable parts.
      - You will not need all six. Reach for the one that answers your open question.
  - title: Draw badly, then make it ask
    note: draw-it-before-the-ai-builds-it
    from: draw-badly-on-purpose
    to: try-this
    runes:
      - id: draw-badly
        section: draw-badly-on-purpose
        quote: You want one you're happy to cross out.
      - id: make-it-ask
        section: make-the-teammate-ask-questions
        quote: Ask me five questions before you build anything.
    trial: Draw a use case diagram with one figure and three ovals on paper, photograph it, give it to your AI, and ask what is missing.
    digest:
      - Draw on paper, badly, so you are happy to cross it out.
      - A drawing is only worth keeping while it matches the code.
      - Ask your AI what is missing and to ask you questions before it builds.
