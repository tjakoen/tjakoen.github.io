id: the-fundamentals-you-still-own
note: the-fundamentals-you-still-own
title: The fundamentals you still own
summary: In three short stops I tell you why reading becomes your job when an AI types, which four fundamentals matter more because of it, and the one small thing to practice for each, with a good teacher to send you to.
audio: /media/lessons/the-fundamentals-you-still-own.m4a
stops:
- title: Your job turns into reading
  note: the-fundamentals-you-still-own
  from: intro
  to: reading-a-diff
  runes:
  - id: yes-no-not-like-that
    section: intro
    quote: my job is to say yes, no, or not like that
  - id: deleted-lines
    section: reading-a-diff
    quote: Look hardest at what was deleted
  trial: After your next small change, ask your AI to explain the diff line by line, then find one line it glossed over and ask about that one.
  digest:
  - When an AI types, you read more than you write.
  - A diff is the list of changes, and approving one you cannot read is approving on trust.
  - Read the files, ask what each change is for, and look hardest at what was deleted.
- title: Undo, and code a stranger can read
  note: the-fundamentals-you-still-own
  from: git-so-every-step-can-be-undone
  to: code-a-stranger-can-follow
  runes:
  - id: clean-commit
    section: git-so-every-step-can-be-undone
    quote: If your last commit is clean, a bad session costs you nothing.
  - id: stranger
    section: code-a-stranger-can-follow
    quote: A new session never remembers why you did a thing
  trial: Commit before the next step of your plan. When a step goes wrong, throw it away and ask again with a better brief.
  digest:
  - Git is an undo button that goes back days.
  - Commit small, one per plan step, with a message that says what it did.
  - Write code a stranger can follow, because the next session is a stranger.
- title: Tests, and what you still own
  note: the-fundamentals-you-still-own
  from: tests-so-done-means-something
  to: your-turn
  runes:
  - id: diff-and-test
    section: tests-so-done-means-something
    quote: A diff can look perfect and break something three files away
  - id: explain-and-fix
    section: what-im-not-saying
    quote: Could I explain this, and fix it, if the AI weren't here tomorrow?
  trial: "Ask your AI for one small change, then do the whole routine by hand: commit first, read the diff yourself, run the tests, and note what you caught."
  digest:
  - A diff tells you what changed. A test tells you whether it still works. You want both.
  - Skipping the fundamentals does not make you faster. It makes you someone who cannot finish or fix things.
  - Could I explain this, and fix it, if the AI were not here tomorrow?
