id: catch-the-idea-then-loop-it
note: catch-the-idea-then-loop-it
title: Catch the idea, then loop it
summary: In three short stops I show you how to catch an idea in one line, why a catch is not yet a brief, and why most ideas should stay in the inbox.
audio: /media/lessons/catch-the-idea-then-loop-it.m4a
stops:
- title: Catch it in one line
  note: catch-the-idea-then-loop-it
  from: intro
  to: catch-it-in-one-line
  runes:
  - id: vanish
    section: intro
    quote: Most of them vanish.
  - id: ten-seconds
    section: catch-it-in-one-line
    quote: A catch that takes longer than ten seconds won't get done on the bus.
  trial: For one day, write every idea down in one line, wherever you catch it, without judging any of them.
  digest:
  - Cheap building means more ideas than evenings, and most vanish.
  - Keep one inbox you can reach from anywhere, and write one line per idea.
  - Do not design it yet. A catch longer than ten seconds will not get done.
- title: A catch is not a brief
  note: catch-the-idea-then-loop-it
  from: then-dont-build-from-the-line
  to: then-dont-build-from-the-line
  runes:
  - id: catch-not-brief
    section: then-dont-build-from-the-line
    quote: The line in your inbox is a catch, not a brief.
  - id: interview
    section: then-dont-build-from-the-line
    quote: ask it to interview you, one question at a time
  trial: Pick the idea that surprised you most and ask your AI to interview you into a three-part brief. Change one line and save it next to your plan.
  digest:
  - The line in your inbox is a catch, not a brief.
  - Pick one idea and ask your AI to interview you, one question at a time, until the brief is complete.
  - The inbox feeds the brief, the brief feeds the plan, and the plan feeds the loop.
- title: Most ideas stay in the inbox
  note: catch-the-idea-then-loop-it
  from: most-ideas-should-stay-in-the-inbox
  to: your-turn
  runes:
  - id: never-built
    section: most-ideas-should-stay-in-the-inbox
    quote: most of your ideas should never get built
  - id: one-project
    section: most-ideas-should-stay-in-the-inbox
    quote: one active project at a time
  trial: Keep the inbox going for a week, then delete the ideas that already look smaller, and tell me which one you were glad to delete.
  digest:
  - An inbox that only grows is a guilt pile.
  - Most of your ideas should never get built, so let them die cheaply.
  - Try one active project at a time. When you are tempted by a second, add a line instead.
