<!-- molecules/block-form — a whole form, as ONE renderable block for the page builder. This is what
     the reframing of /builder costs and all it costs: the form stops being the subject of the page
     and becomes one entry in the block set, without a line of field-matcher.ts changing.
     DATA is a FieldSpec exactly as matchSpec returns it: fields, messages, choices, checks. The four
     tags are the same four the builder page carried when the page was about forms, moved inside a
     component so the composition can name a form the way it names a card.
     No submit control, on purpose and not by omission: no submit verb exists in the AI vocabulary
     and there is nothing on a static site to submit to. onsubmit is stopped here so a stray Enter in
     a generated field cannot reload the page and take the composition with it. -->
<form class="builder-form" onsubmit="return false">
  <b-field each="fields" size="sm"></b-field>
  <b-memo each="messages" size="sm" rows="6"></b-memo>
  <b-choice each="choices" size="sm"></b-choice>
  <b-check each="checks" size="sm"></b-check>
</form>
