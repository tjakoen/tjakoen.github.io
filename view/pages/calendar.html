<!DOCTYPE html>
<html lang="en" data-themes="sourdough baguette brioche">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calendar · TJ's Desk</title>
  <meta name="description" content="The desk's calendar: a Month and a Feed view over the same real things, note publish dates and posts about what shipped. Part of the desktop metaphor, not a live scheduling tool.">
</head>
<body data-screen="calendar" class="app-window-backdrop">
  <div class="app-shell app-window" data-section="calendar" data-rail-collapsed="false" data-surface="screen">
    <portfolio-frame />
    <main class="app-shell__main">
      <div class="board">
        <!-- Two views over the same events, and which one you get is the point. The YEAR STRIP is the
             overview: a year per row, twelve months across, marks per dated thing. It is never blank,
             because it shows the whole record at once. Clicking any month opens the MONTH GRID for
             that month, which is where a day-level calendar is actually useful, since by then you
             chose the month and it is not empty by accident. The old page opened straight onto a grid
             of the current month with no navigation, so most visits landed on an empty box with no
             way out of it. -->
        <section class="cal" data-cal-panel="years" hidden aria-label="Years">
          <div class="cal__head">
            <span class="cal__month" data-cal="title">Loading…</span>
            <a class="cal__to-feed" href="#feed">Jump to feed ↓</a>
          </div>
          <div data-cal="years"></div>
          <!-- The legend keys the MARKS, so it stops at the three colours they use. The current month
               is marked by highlighting its label instead, and a fourth swatch here was a filled dot
               identical to the events one: a key that pointed at nothing on the strip. -->
          <p class="cal__legend">
            <span><span class="cal__swatch" style="background: var(--color-accent-soft)"></span>notes</span>
            <span><span class="cal__swatch" style="background: var(--paper-2); border: 1px solid var(--line-soft)"></span>shipped</span>
            <span><span class="cal__swatch cal__swatch--event"></span>events</span>
          </p>
        </section>

        <section class="cal" data-cal-panel="month" hidden aria-label="Month">
          <div class="cal__head">
            <div class="cal__nav">
              <button class="cal__back" type="button" data-cal="back">← All years</button>
              <span class="cal__month" data-cal="month-title">Loading…</span>
            </div>
            <div class="cal__nav">
              <button class="cal__step" type="button" data-cal="prev" aria-label="Previous month">‹</button>
              <button class="cal__step" type="button" data-cal="next" aria-label="Next month">›</button>
            </div>
          </div>
          <div class="cal__grid" data-cal="dow"></div>
          <div class="cal__grid" data-cal="grid"></div>
          <p class="cal__legend" data-cal="month-note"></p>
        </section>
        <!-- Outside the panels above on purpose: those sections ship hidden and are only revealed by
             the script, so a noscript INSIDE one could never be read by the reader it is written for. -->
        <noscript><p class="muted">The year strip needs a little JavaScript. With it off, the feed
          below is the whole page, every dated thing as a plain list.</p></noscript>

        <section class="feed" id="feed" data-cal-panel="feed">
          <h2 class="section-head"><span>Feed</span></h2>
          <!-- Filter tabs over the ONE feed list below (no second dataset, no fetch): the script hides
               the cards whose data-event-kind is out of scope. Events is the default WITH JS; with JS
               off the whole feed shows, which is the honest fallback (All). The chosen tab lives in
               the URL as ?feed=notes|all, so a filtered feed is linkable and survives a reload. -->
          <div class="feed__tabs" role="tablist" aria-label="Filter the feed" data-feed-tabs hidden>
            <button class="feed__tab" type="button" role="tab" data-feed-tab="events" aria-selected="true">Events</button>
            <button class="feed__tab" type="button" role="tab" data-feed-tab="notes" aria-selected="false">Notes</button>
            <button class="feed__tab" type="button" role="tab" data-feed-tab="all" aria-selected="false">All</button>
          </div>
          <ol class="feed__list"><feed-card each="calendarEvents"></feed-card></ol>
          <p class="feed__empty" data-feed-empty hidden>Nothing under this tab yet.</p>
        </section>

        <div class="page-foot">
          Part of <a href="/">tjakoen.github.io</a>, built with itself.
          <p>🤖 Built with Claude. I don't prompt and pray, I prompt and prove.
            <a href="/notes/ten-times-zero">How I actually work with AI, receipts and all →</a></p>
        </div>
      </div>
    </main>
  </div>

  <script>
    // Reads the real events straight off the server-rendered Feed (one source of truth, no fetch, no
    // second copy of the data) and plots the current Month from them, shown ABOVE the feed. The feed
    // itself is always on the page (it is the whole page with no JS — the month grid needs JS and
    // ships hidden). Clicking a day's chip scrolls the feed to that post and flashes it. Every event
    // is a real dated thing (note publish dates + shipped posts + the events collection) — nothing invented.
    (function () {
      var feedList = document.querySelector('.feed__list');
      var yearsPanel = document.querySelector('[data-cal-panel="years"]');
      if (!feedList || !yearsPanel) return;

      // ---- relative dates on the feed cards: server renders each date absolute (export-safe, in
      // title); rewrite [data-relativize] to "Today / Yesterday / N days ago", keeping the absolute. ----
      (function relativize() {
        var now = new Date();
        var today = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());
        Array.prototype.forEach.call(feedList.querySelectorAll('[data-relativize]'), function (el) {
          var iso = el.getAttribute('data-date');
          if (!iso) return;
          var p = iso.split('-');
          if (p.length !== 3) return;
          var then = Date.UTC(+p[0], +p[1] - 1, +p[2]);
          var days = Math.round((today - then) / 86400000);
          if (days < 0) return;
          if (!el.getAttribute('title')) el.setAttribute('title', el.textContent);
          el.textContent = days === 0 ? 'Today' : days === 1 ? 'Yesterday' : days + ' days ago';
        });
      })();

      // ---- read events off the feed DOM ----
      var cards = Array.prototype.slice.call(feedList.querySelectorAll('.feed-card'));

      // ---- the feed's filter tabs: Events (default) / Notes / All ----
      // One list, hidden rows — no second dataset. "events" means the events collection (talk,
      // hackathon, student-highlight, anything authored as content/events/*.md); "notes" means note
      // publish dates; the shipped posts have no tab of their own and live under All. The tabs are
      // hidden until this runs, so with JS off the reader gets the whole feed instead of a dead control.
      var tabsEl = document.querySelector('[data-feed-tabs]');
      var emptyEl = document.querySelector('[data-feed-empty]');
      var TABS = ['events', 'notes', 'all'];
      var DEFAULT_TAB = 'events';
      var currentTab = DEFAULT_TAB;

      function inTab(kind, tab) {
        if (tab === 'all') return true;
        if (tab === 'notes') return kind === 'note';
        return kind !== 'note' && kind !== 'shipped';
      }

      // The chosen tab is page state, so it belongs in the URL: a filtered feed can then be linked,
      // reloaded, and arrived at directly instead of only clicked into. Same replaceState the notes
      // feed uses for ?tag= (filtering isn't navigation), and the default drops the parameter so a
      // plain /calendar stays plain. Every OTHER parameter is carried through untouched, because a
      // tour arrives with its own (?crumb=) and it is not this island's to throw away.
      function tabFromUrl() {
        var q = new URLSearchParams(location.search).get('feed');
        return q && TABS.indexOf(q) !== -1 ? q : DEFAULT_TAB;   // an unknown value is not an error, just the default
      }

      function syncUrl(tab) {
        var q = new URLSearchParams(location.search);
        if (tab === DEFAULT_TAB) q.delete('feed'); else q.set('feed', tab);
        var qs = q.toString();
        try { history.replaceState(null, '', location.pathname + (qs ? '?' + qs : '') + location.hash); }
        catch { /* file:// — leave the URL be */ }
      }

      function applyTab(tab) {
        currentTab = tab;
        var shown = 0;
        cards.forEach(function (li) {
          var visible = inTab(li.getAttribute('data-event-kind') || 'note', tab);
          li.hidden = !visible;
          if (visible) shown++;
        });
        if (tabsEl) {
          Array.prototype.forEach.call(tabsEl.querySelectorAll('[data-feed-tab]'), function (btn) {
            btn.setAttribute('aria-selected', btn.getAttribute('data-feed-tab') === tab ? 'true' : 'false');
          });
        }
        if (emptyEl) emptyEl.hidden = shown > 0;
        syncUrl(tab);
      }

      if (tabsEl) {
        tabsEl.addEventListener('click', function (ev) {
          var btn = ev.target.closest('[data-feed-tab]');
          if (btn) applyTab(btn.getAttribute('data-feed-tab'));
        });
        tabsEl.hidden = false;
        applyTab(tabFromUrl());
      }
      var events = cards.map(function (li) {
        var titleEl = li.querySelector('.feed-card__title');
        return {
          id: li.id,
          date: li.getAttribute('data-date') || '',
          kind: li.getAttribute('data-event-kind') || 'note',
          title: titleEl ? titleEl.textContent.trim() : '',
        };
      }).filter(function (e) { return e.date; });

      // ---- scrolling to a feed card: the feed is always on the page, so a dot just scrolls to its
      // card and flashes it. The strip plots EVERYTHING, so a dot can point at a card the current
      // tab is hiding — fall back to All rather than scrolling to nothing. ----
      function goToCard(id) {
        var row = id && document.getElementById(id);
        if (!row) return;
        if (row.hidden) applyTab('all');
        row.scrollIntoView({ behavior: 'smooth', block: 'center' });
        row.classList.add('feed-card--highlight');
        setTimeout(function () { row.classList.remove('feed-card--highlight'); }, 1600);
      }

      // A named chip for one event, used inside the month grid where a day cell is wide enough for a
      // title. Clicking it scrolls the feed to that card.
      function makeChip(e) {
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'cal__event cal__event--' + (e.kind || 'note');
        btn.textContent = e.title;
        if (e.id) btn.setAttribute('data-target', e.id);   // the feed card this chip scrolls to
        btn.addEventListener('click', function () { goToCard(e.id); });
        return btn;
      }

      // In the YEAR strip a month cell is about 44px wide, which is no room for a title, so each
      // dated thing is a plain mark rather than a control. The cell around them is the button: it
      // opens the month. One target per cell beats a dozen 9px ones.
      function makeMark(e) {
        var mark = document.createElement('span');
        mark.className = 'cal__dot cal__dot--' + (e.kind || 'note');
        return mark;
      }

      // ---- Years ----
      var monthsShort = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun',
        'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
      var monthsLong = ['January', 'February', 'March', 'April', 'May', 'June', 'July',
        'August', 'September', 'October', 'November', 'December'];

      var yearsEl = document.querySelector('[data-cal="years"]');
      var titleEl = document.querySelector('[data-cal="title"]');

      // year → twelve buckets. Only years that actually contain something get a row, so the strip
      // never invents a blank year to sit between two real ones.
      var byYear = {};
      events.forEach(function (e) {
        var p = e.date.split('-');
        if (p.length !== 3) return;
        if (!byYear[p[0]]) {
          byYear[p[0]] = [];
          for (var m = 0; m < 12; m++) byYear[p[0]].push([]);
        }
        byYear[p[0]][+p[1] - 1].push(e);
      });

      var years = Object.keys(byYear).sort();
      var now = new Date();
      var thisYear = String(now.getFullYear()), thisMonth = now.getMonth();

      // The heading states the real span rather than a single month, because the span is the thing
      // the strip is for: it says how far back this record goes without anyone counting rows.
      if (years.length) {
        var firstYear = years[0], lastYear = years[years.length - 1];
        var firstMonth = byYear[firstYear].findIndex(function (b) { return b.length; });
        var lastBuckets = byYear[lastYear];
        var lastMonth = 0;
        for (var k = 0; k < 12; k++) if (lastBuckets[k].length) lastMonth = k;
        titleEl.textContent = monthsLong[firstMonth] + ' ' + firstYear +
          ' to ' + monthsLong[lastMonth] + ' ' + lastYear;
      } else {
        titleEl.textContent = 'Nothing dated yet';
      }

      years.slice().reverse().forEach(function (y) {     // newest year first: the top of the page is the recent end
        var row = document.createElement('div');
        row.className = 'cal__year';

        var label = document.createElement('span');
        label.className = 'cal__year-label';
        label.textContent = y;
        row.appendChild(label);

        var strip = document.createElement('div');
        strip.className = 'cal__months';

        byYear[y].forEach(function (bucket, m) {
          // The whole cell is the control, so the click target is a month rather than a 9px dot,
          // and an empty month opens too: prev/next lands on those anyway, and a month that refuses
          // to open is a dead spot in a grid where every other cell answers.
          var cell = document.createElement('button');
          cell.type = 'button';
          cell.className = 'cal__mon';
          if (!bucket.length) cell.classList.add('cal__mon--empty');
          if (y === thisYear && m === thisMonth) cell.classList.add('cal__mon--now');
          cell.setAttribute('data-month', y + '-' + String(m + 1).padStart(2, '0'));
          cell.setAttribute('aria-label', monthsLong[m] + ' ' + y + ', ' +
            (bucket.length ? bucket.length + (bucket.length === 1 ? ' entry' : ' entries') : 'nothing'));
          cell.addEventListener('click', function () { showMonth(+y, m); });

          var name = document.createElement('span');
          name.className = 'cal__mon-label';
          name.textContent = monthsShort[m];
          cell.appendChild(name);

          var dots = document.createElement('span');
          dots.className = 'cal__dots';
          // A cell holds three marks per row at twelve months across. Six keeps a busy month to two
          // rows; past that the remainder is a count, because thirty marks would say no more than
          // "a lot" while wrecking the row height.
          var SHOWN = 6;
          bucket.slice(0, SHOWN).forEach(function (e) { dots.appendChild(makeMark(e)); });
          if (bucket.length > SHOWN) {
            var more = document.createElement('span');
            more.className = 'cal__more';
            more.textContent = '+' + (bucket.length - SHOWN);
            dots.appendChild(more);
          }
          cell.appendChild(dots);

          strip.appendChild(cell);
        });

        row.appendChild(strip);
        yearsEl.appendChild(row);
      });

      // ---- Month grid: the drill-in ----
      // Reached by clicking a month in the strip, and addressable as ?month=YYYY-MM so a month is
      // linkable, survives a reload and can be the landing state of a CRUMB step, exactly like the
      // feed's ?feed= tab. Navigation is clamped to the months the data actually spans: stepping into
      // 2031 would be a working control that can only ever show nothing.
      var monthPanel = document.querySelector('[data-cal-panel="month"]');
      var dowEl = document.querySelector('[data-cal="dow"]');
      var gridEl = document.querySelector('[data-cal="grid"]');
      var monthTitleEl = document.querySelector('[data-cal="month-title"]');
      var monthNoteEl = document.querySelector('[data-cal="month-note"]');
      var prevBtn = document.querySelector('[data-cal="prev"]');
      var nextBtn = document.querySelector('[data-cal="next"]');
      var backBtn = document.querySelector('[data-cal="back"]');
      var dayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

      var byDate = {};
      events.forEach(function (e) { (byDate[e.date] = byDate[e.date] || []).push(e); });

      // the span, as a month index (year * 12 + month) so clamping is one comparison
      function idx(y, m) { return y * 12 + m; }
      var minIdx = null, maxIdx = null;
      Object.keys(byYear).forEach(function (y) {
        byYear[y].forEach(function (bucket, m) {
          if (!bucket.length) return;
          var i = idx(+y, m);
          if (minIdx === null || i < minIdx) minIdx = i;
          if (maxIdx === null || i > maxIdx) maxIdx = i;
        });
      });

      var viewY = null, viewM = null;

      function isoKey(y, m, d) {
        return y + '-' + String(m + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
      }

      // ?month= is page state, same treatment the feed tabs get: written on change, dropped when the
      // strip is showing, and every OTHER parameter carried through untouched (a tour arrives with
      // its own ?crumb= and it is not this island's to discard).
      function syncMonthUrl(key) {
        var q = new URLSearchParams(location.search);
        if (key) q.set('month', key); else q.delete('month');
        var qs = q.toString();
        try { history.replaceState(null, '', location.pathname + (qs ? '?' + qs : '') + location.hash); }
        catch { /* file:// — leave the URL be */ }
      }

      function showYears() {
        viewY = viewM = null;
        monthPanel.hidden = true;
        yearsPanel.hidden = false;
        syncMonthUrl(null);
      }

      function showMonth(y, m) {
        viewY = y; viewM = m;
        yearsPanel.hidden = true;
        monthPanel.hidden = false;
        monthTitleEl.textContent = monthsLong[m] + ' ' + y;

        var here = idx(y, m);
        prevBtn.disabled = minIdx === null || here <= minIdx;   // the record has ends; the controls say so
        nextBtn.disabled = maxIdx === null || here >= maxIdx;

        gridEl.textContent = '';
        var first = new Date(y, m, 1).getDay();
        var inMonth = new Date(y, m + 1, 0).getDate();
        var prevLen = new Date(y, m, 0).getDate();
        var count = 0;

        for (var i = 0; i < 42; i++) {
          var cell = document.createElement('div');
          cell.className = 'cal__cell';
          var dateNum, out = false, cy = y, cm = m;
          if (i < first) { dateNum = prevLen - first + 1 + i; out = true; cm = m - 1; }
          else if (i >= first + inMonth) { dateNum = i - first - inMonth + 1; out = true; cm = m + 1; }
          else { dateNum = i - first + 1; }
          if (cm < 0) { cm = 11; cy = y - 1; }
          if (cm > 11) { cm = 0; cy = y + 1; }

          if (out) cell.classList.add('cal__cell--out');
          if (!out && cy === now.getFullYear() && cm === now.getMonth() && dateNum === now.getDate()) {
            cell.classList.add('cal__cell--today');
          }

          var num = document.createElement('span');
          num.className = 'cal__num';
          num.textContent = dateNum;
          cell.appendChild(num);

          (byDate[isoKey(cy, cm, dateNum)] || []).forEach(function (e) {
            cell.appendChild(makeChip(e));
            if (!out) count++;
          });
          gridEl.appendChild(cell);
        }

        // An empty month is a real answer, not a broken page, so it says so in words rather than
        // leaving a reader to work out whether the grid failed to load.
        monthNoteEl.textContent = count
          ? count + (count === 1 ? ' thing' : ' things') + ' this month. Click one to find it in the feed.'
          : 'Nothing this month. Step across with the arrows, or go back to all years.';

        syncMonthUrl(y + '-' + String(m + 1).padStart(2, '0'));
      }

      function step(delta) {
        if (viewY === null) return;
        var i = idx(viewY, viewM) + delta;
        if (minIdx !== null && (i < minIdx || i > maxIdx)) return;
        showMonth(Math.floor(i / 12), i % 12);
      }

      dayNames.forEach(function (d) {
        var c = document.createElement('div');
        c.className = 'cal__dow';
        c.textContent = d;
        dowEl.appendChild(c);
      });

      backBtn.addEventListener('click', showYears);
      prevBtn.addEventListener('click', function () { step(-1); });
      nextBtn.addEventListener('click', function () { step(1); });

      // Arrow keys page through months while the grid is up, because a calendar that only steps by
      // mouse is a calendar you stop stepping through.
      document.addEventListener('keydown', function (ev) {
        if (monthPanel.hidden || ev.metaKey || ev.ctrlKey || ev.altKey) return;
        var tag = (ev.target.tagName || '').toLowerCase();
        if (tag === 'input' || tag === 'textarea') return;
        if (ev.key === 'ArrowLeft') { step(-1); }
        else if (ev.key === 'ArrowRight') { step(1); }
        else if (ev.key === 'Escape') { showYears(); }
        else return;
        ev.preventDefault();
      });

      // Boot: a ?month= in the URL opens straight onto that month, otherwise the strip.
      var wanted = new URLSearchParams(location.search).get('month');
      var wm = wanted && /^\d{4}-\d{2}$/.test(wanted) ? wanted.split('-') : null;
      if (wm && +wm[1] >= 1 && +wm[1] <= 12) showMonth(+wm[0], +wm[1] - 1);
      else showYears();
    })();
  </script>
</body>
</html>
